<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale | PsikopediBlog</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader-wrapper">
        <div class="loader-text">YÜKLENİYOR...</div>
        <div class="loader-line"></div>
    </div>

    <!-- Navbar -->
    <nav>
        <a href="index.html" class="logo btn">PsikopediBlog</a>
        <div class="nav-links">
            <a href="index.html" class="btn">Ana Sayfa</a>
            <a href="index.html#articles" class="btn">Makaleler</a>
            <a href="#contact" class="btn">İletişim</a>
        </div>
    </nav>

    <!-- Article Content: fetched from backend -->
    <article class="article-page" id="article-content">
        <div class="article-hero">
            <div class="article-hero-head">
                <a href="index.html" class="btn">← Geri</a>
                <div class="article-meta" id="article-meta">&nbsp;</div>
            </div>
            <h1 class="article-title" id="article-title">Makale yükleniyor...</h1>
            <div class="article-image" id="article-image"></div>
        </div>

        <div class="article-body" id="article-body" style="padding:2rem 0;">
            <div class="loading" id="article-loading">İçerik yükleniyor...</div>
        </div>
    </article>
    <!-- Contact Section -->
    <section class="contact-section" id="contact">
        <div class="contact-container">
            <h2>İletişime Geçin</h2>
            <p>Sorularınız veya önerileriniz için aşağıdaki kanallardan bana ulaşabilirsiniz.</p>
            <div class="contact-info">
                <div class="info-box">
                    <i class="fas fa-envelope"></i>
                    <p>info@psikopediblog.com</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 PsikopediBlog. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- DOMPurify: client-side XSS protection -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Load single article from backend using ?id= or ?slug=
        (async function loadArticleFromServer(){
            const params = new URLSearchParams(window.location.search);
            const idOrSlug = params.get('id') || params.get('slug');
            const bodyEl = document.getElementById('article-body');
            const titleEl = document.getElementById('article-title');
            const metaEl = document.getElementById('article-meta');
            const imageEl = document.getElementById('article-image');
            const loadingEl = document.getElementById('article-loading');

            if (!idOrSlug) {
                if (loadingEl) loadingEl.textContent = 'No article ID or slug found.';
                return;
            }

            try {
                const res = await fetch('/api/articles/' + encodeURIComponent(idOrSlug));
                if (!res.ok) {
                    throw new Error('Failed to fetch article from server.');
                }
                const data = await res.json();

                const title = data.title || '';
                const author = data.author || '';
                const date = data.date || '';
                const content = data.content || data.summary || '';
                const image = data.image_url || '';

                if (titleEl) titleEl.textContent = title || 'Untitled Article';
                if (metaEl) metaEl.textContent = (author || '') + (date ? ' • ' + date : '');
                if (imageEl) {
                    imageEl.innerHTML = image ? ('<img src="' + image + '" alt="Article image">') : '';
                }

                if (!bodyEl) return;
                if (window.DOMPurify) {
                    bodyEl.innerHTML = DOMPurify.sanitize(content);
                } else {
                    bodyEl.innerHTML = content;
                }
            } catch (err) {
                if (loadingEl) loadingEl.textContent = 'An error occurred while loading the article.';
                console.error(err);
            } finally {
                if (loadingEl) loadingEl.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
