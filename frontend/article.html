<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Psikopedi yazısı">
    <title>Yazı | Psikopedi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#icerik">İçeriğe geç</a>

    <header class="site-header">
        <div class="container">
            <a href="/" class="brand" aria-label="Psikopedi ana sayfa">
                <span class="brand-mark" data-brand-mark></span>
                <span>
                    <span class="brand-name">Psiko<span>pedi</span></span>
                    <span class="brand-tagline">psikoloji / ilişkiler / gelişim</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Ana menü">
                <a href="/#yazilar">Yazılar</a>
                <a href="/#kategoriler">Kategoriler</a>
                <a href="/#hakkinda">Hakkında</a>
            </nav>
        </div>
    </header>

    <main class="article-page" id="icerik">
        <div class="article-shell">
            <a href="/" class="btn back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                Tüm yazılar
            </a>

            <article aria-busy="true" data-article>
                <header class="article-header">
                    <div data-chip></div>
                    <h1 data-title>Yükleniyor…</h1>
                    <div data-meta></div>
                </header>
                <div data-cover></div>
                <div class="article-body" data-body></div>
            </article>

            <section class="related" aria-labelledby="benzer-baslik" data-related hidden>
                <h2 id="benzer-baslik">Benzer yazılar</h2>
                <ul class="article-grid" data-related-list></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Psikopedi. Tüm hakları saklıdır.</p>
            <p>Yazılar bilgi amaçlıdır, profesyonel destek yerine geçmez.</p>
        </div>
    </footer>

    <!-- DOMPurify: sanitizes article HTML before it is rendered -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
    <script type="module" src="article.js"></script>
</body>
</html>
