<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Psikoloji ve yaşam üzerine derinlemesine yazılar. Zihinsel sağlık, ilişkiler ve kişisel gelişim.">
    <title>Psikoloji & Yaşam | PsikopediBlog</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader-wrapper">
        <div class="loader-text">PsikopediBlog</div>
        <div class="loader-line"></div>
        <div class="comic-effects">
            <div class="speech-bubble">POW!</div>
            <div class="sound-effect">WHAM!</div>
            <div class="motion-lines"></div>
        </div>
    </div>

    <!-- Navbar -->
    <nav>
        <a href="/" class="logo btn">PsikopediBlog</a>
        <div class="nav-links">
            <a href="/" class="btn">Ana Sayfa</a>
            <a href="#articles" class="btn">Makaleler</a>
            <a href="#contact" class="btn">İletişim</a>
        </div>
        
    </nav>

    <!-- Main Blog Content -->
    <main class="main-content">

        <!-- Featured Post: populated from backend -->
        <section class="featured-section" id="featured-section">
            <!-- Backend will render featured post here -->
        </section>

        <!-- Blog List: populated from backend -->
        <section class="blog-list" id="articles">
            <!-- Backend will render blog cards here -->
        </section>

    </main>

    <!-- Contact Section -->
    <section class="contact-section" id="contact">
        <div class="contact-container">
            <h2>İletişime Geçin</h2>
            <p>Sorularınız veya önerileriniz için aşağıdaki kanallardan bana ulaşabilirsiniz.</p>
            <div class="contact-info">
                <div class="info-box">
                    <i class="fas fa-envelope"></i>
                    <p>info@psikopediblog.com</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 PsikopediBlog. Tüm hakları saklıdır.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
