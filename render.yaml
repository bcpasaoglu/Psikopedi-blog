# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: psikopedi-blog
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false # set in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_SAMPLE_DATA
        value: "true"
