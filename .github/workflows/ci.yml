name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Concurrent load test (fails on any error)
        run: |
          DATABASE_URL=sqlite:///./load.db uvicorn backend.main:app --port 8000 --log-level warning &
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          python scripts/load_test.py http://127.0.0.1:8000 --concurrency 100 --requests 2000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t psikopedi-blog .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 psikopedi-blog
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/articles | grep -q basarinin-psikolojisi
          docker rm -f app
